<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร่างไอคอน B รอบ 2</title>
<style>
@font-face{font-family:Anuphan;src:url(../fonts/anuphan-thai-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Anuphan;src:url(../fonts/anuphan-thai-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:Mali;src:url(../fonts/mali-thai-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:Mali;src:url(../fonts/mali-latin-700-normal.woff2) format('woff2');font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:Anuphan;src:url(../fonts/anuphan-latin-400-normal.woff2) format('woff2');font-weight:400;unicode-range:U+0000-00FF}
:root{--bg:#fff8ef;--fg:#3b2e27;--mut:#806f61;--card:#fff;--bd:#f0e0cc;--ac:#b45428}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Anuphan,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 24px 40px}
h1{font-family:Mali;font-size:28px;margin:0 0 4px}.sub{color:var(--mut);font-size:15px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.opt{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px 12px;text-align:center}
.opt.cur{background:transparent;border-style:dashed}
.big{width:100%;max-width:180px;aspect-ratio:1;border-radius:22.4%;display:block;margin:0 auto 12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.opt b{font-family:Mali;font-size:18px;display:block}.opt p{margin:6px 0 0;color:var(--mut);font-size:13.5px;line-height:1.5}
.tag{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--ac);border-radius:999px;padding:1px 9px;margin-bottom:6px}
.cur .tag{background:#9b8b7d}
h2{font-family:Mali;font-size:20px;margin:28px 0 10px}
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wall{border-radius:22px;padding:22px 18px 16px;display:grid;grid-template-columns:repeat(5,1fr);row-gap:14px}
.wall.l{background:linear-gradient(160deg,#e7e3f4,#d9dbef 55%,#e9d9df)}.wall.d{background:linear-gradient(160deg,#1d2130,#2a2338 60%,#3a2a2c)}
.app{display:grid;justify-items:center;gap:6px}.app img{width:64px;height:64px;border-radius:22.4%}.app span{font-size:12px;font-family:system-ui;color:#1d1d1f}.wall.d .app span{color:#fff}
.dum{width:64px;height:64px;border-radius:22.4%;background:rgba(255,255,255,.55)}.wall.d .dum{background:rgba(255,255,255,.13)}
.tiny{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:10px}.tiny img{border-radius:22.4%}
</style></head><body><main>
<h1>ร่างไอคอนแบบ B · รอบ 2</h1>
<div class="sub">คงแนวคิดเดิม (แมวโผล่หลังการ์ด 言 บนพื้นส้มอิฐ) แล้วลองเพิ่มรายละเอียดทีละอย่าง · ทุกแบบยังเป็นพิกเซล 64×64 และใช้แมวจากเอนจินของแอป</div>
<div class="grid" id="opts"></div>
<h2>วางบนหน้าจอโฮม (ขนาดจริงประมาณ 60 px)</h2>
<div class="home"><div class="wall l" id="wl"></div><div class="wall d" id="wd"></div></div>
<h2>ขนาดเล็กสุด (40 / 29 px)</h2>
<div class="tiny" id="tiny"></div>
</main>
<script src="../js/pixelcat.js"></script>
<script>
// ---------- เครื่องมือวาดพิกเซล (หน่วย = 1 ช่องบนตาราง 64×64) ----------
const G=64;
function mk(){const c=document.createElement('canvas');c.width=c.height=G;const x=c.getContext('2d');return[c,x]}
const R=(x,X,Y,W,H,c)=>{x.fillStyle=c;x.fillRect(X,Y,W,H)};
function rr(x,X,Y,W,H,r,c){for(let j=0;j<H;j++)for(let i=0;i<W;i++){const dx=Math.max(r-i-.5,i+.5-(W-r),0),dy=Math.max(r-j-.5,j+.5-(H-r),0);if(dx*dx+dy*dy<=r*r)R(x,X+i,Y+j,1,1,c)}}
function disc(x,cx,cy,r,c,skip){for(let j=Math.floor(cy-r);j<cy+r;j++)for(let i=Math.floor(cx-r);i<cx+r;i++){const d=(i+.5-cx)**2+(j+.5-cy)**2;if(d<=r*r&&!(skip&&skip(i,j,Math.sqrt(d))))R(x,i,j,1,1,c)}}
function tri(x,pts,c){const[a,b,d]=pts,ar=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);for(let j=0;j<G;j++)for(let i=0;i<G;i++){const p=[i+.5,j+.5],s1=ar(a,b,p),s2=ar(b,d,p),s3=ar(d,a,p);if((s1>=0&&s2>=0&&s3>=0)||(s1<=0&&s2<=0&&s3<=0))R(x,i,j,1,1,c)}}
function glyph(x,rows,X,Y,s,c){rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='#')R(x,X+i*s,Y+j*s,s,s,c)}))}
// 言 (koto = คำ · Kotoneko = 言葉ねこ) วาดเองแบบพิกเซล 13×12
const KOTO=['......##.....','.......##....','#############','.............','..#########..','.............','..#########..','.............','..#########..','..#.......#..','..#.......#..','..#########..'];
// แมวจากเอนจินของแอป: ตาราง 48×48 สีต่อช่อง
const T=PixelCat._t;
function cat(x,pose,f,X,Y,coat='cream',acc='none',clipY,cx0,cx1){const g=T.frame(pose,f,'light',coat,acc);for(let j=0;j<g.length;j++){if(clipY!=null&&Y+j>=clipY)break;for(let i=0;i<g[j].length;i++)if(g[j][i]&&(cx0==null||(i>=cx0&&i<=cx1)))R(x,X+i,Y+j,1,1,g[j][i])}}
function box(pose,f){const g=T.frame(pose,f,'light');let l=99,r=-1,t=99,b=-1;g.forEach((row,j)=>row.forEach((v,i)=>{if(v){l=Math.min(l,i);r=Math.max(r,i);t=Math.min(t,j);b=Math.max(b,j)}}));return{l,r,t,b}}

// ---------- แบบ B และรายละเอียดที่ลองเพิ่ม ----------
const C={card:'#fffaf3',edge:'#ecd6b8',ink:'#3b2e27',ac:'#b45428',halo:'#c2602f',halo2:'#cc6b37',dot:'#bc5a2b',ol:'#4f372b',fur:'#fff0de',furD:'#f4ddc4',ring:'#e9bd5f',ringD:'#a7772a',ringH:'#fff1c9',spark:'#ffe7c2'};
const PAW=['.EEEEE.','EBBBBBE','EBBBBBE','EDEDEDE','.EEEEE.'];
function paw(x,X,Y){PAW.forEach((r,j)=>[...r].forEach((ch,i)=>{const c={E:C.ol,B:C.fur,D:C.furD}[ch];if(c)R(x,X+i,Y+j,1,1,c)}))}
function ring(x,cx,cy){for(let j=cy-6;j<cy+6;j++)for(let i=cx-6;i<cx+6;i++){const d=Math.hypot(i+.5-cx,j+.5-cy);if(d<=4.6&&d>=2.6)R(x,i,j,1,1,(i+.5-cx)+(j+.5-cy)>1.5?C.ringD:(i<cx-1&&j<cy-1&&d>3.6)?C.ringH:C.ring)}}
function spark(x,X,Y,a,c){R(x,X,Y-a,1,2*a+1,c);R(x,X-a,Y,2*a+1,1,c);if(a>1){R(x,X-1,Y-1,3,3,c)}}
function base(x,o){
  R(x,0,0,G,G,C.ac);
  if(o.dots)for(let j=4;j<G;j+=8)for(let i=(j/8%2?0:4);i<G;i+=8)R(x,i,j,1,1,C.dot);
  const k=o.face?'slowBlink':'sit',f=o.face?3:0,b=box('sit',0),w=b.r-b.l+1,X=Math.round(32-w/2)-b.l,Y=4-b.t,hc=X+23.5;
  if(o.halo){disc(x,hc,17,18,C.halo);disc(x,hc,17,14,C.halo2)}
  if(o.spark){spark(x,53,9,3,C.spark);spark(x,57,18,1,C.spark)}
  cat(x,k,f,X,Y,'cream','none',40,9,38); // ตัดหางที่โผล่ขอบการ์ดออก เหลือแค่หัว
  rr(x,8,27,48,31,6,'rgba(0,0,0,.18)');rr(x,8,26,48,31,6,C.card);for(let i=10;i<54;i++)R(x,i,56,1,1,C.edge);
  if(o.ring)ring(x,13,34); // ห่วงที่มุมซ้ายของการ์ด ใต้อุ้งเท้า
  glyph(x,KOTO,19,29,2,C.ink);
  if(o.paws){paw(x,Math.round(hc-17),23);paw(x,Math.round(hc+10),23)} // อุ้งเท้าอยู่ข้างแก้ม ไม่บังหน้า
}
const D=[
 {id:'B',n:'แบบ B เดิม',d:'จุดตั้งต้นจากรอบที่แล้ว',o:{}},
 {id:'B1',n:'อุ้งเท้าเกาะการ์ด',d:'เพิ่มอุ้งเท้าสองข้างเกาะขอบการ์ด ดูเหมือนแมวกำลังชะโงกมาอ่านด้วยกัน',o:{paws:1}},
 {id:'B2',n:'การ์ดคำศัพท์มีห่วง',d:'เพิ่มห่วงที่มุมการ์ดแบบการ์ดท่องศัพท์ของญี่ปุ่น (単語カード) บอกว่าเป็นแอปทบทวนคำ',o:{paws:1,ring:1}},
 {id:'B3',n:'ครบชุด',d:'เพิ่มแสงหลังหัวให้แมวเด่น และประกายมุมขวาบนแทนจุดแดงของไอคอนเดิม คนที่ใช้อยู่ยังจำตำแหน่งได้',o:{paws:1,ring:1,halo:1,spark:1}},
 {id:'B4',n:'ครบชุด + หลับตายิ้ม',d:'เหมือน B3 แต่แมวหลับตาพริ้ม (ท่ากะพริบตาช้าในแอป แปลว่าไว้ใจ) ดูอบอุ่นขึ้น',o:{paws:1,ring:1,halo:1,spark:1,face:1}}];
const big=c=>{const v=document.createElement('canvas');v.width=v.height=512;const x=v.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(c,0,0,512,512);return v.toDataURL()};
const urls={};D.forEach(o=>{const[c,x]=mk();base(x,o.o);urls[o.id]=big(c)});
document.getElementById('opts').innerHTML=D.map(o=>`<div class="opt${o.id==='B'?' cur':''}"><span class="tag">${o.id}</span><img class="big" src="${urls[o.id]}" alt=""><b>${o.n}</b><p>${o.d}</p></div>`).join('');
const ids=D.map(o=>o.id),row=id=>{document.getElementById(id).innerHTML=ids.map(k=>`<div class="app"><img src="${urls[k]}" alt=""><span>${k}</span></div>`).join('')+Array(5).fill('<div class="app"><div class="dum"></div><span>&nbsp;</span></div>').join('')};
row('wl');row('wd');
document.getElementById('tiny').innerHTML=ids.map(k=>`<div style="text-align:center"><img src="${urls[k]}" width="40" height="40" alt=""> <img src="${urls[k]}" width="29" height="29" alt=""><div style="font-size:12px;color:#806f61">${k}</div></div>`).join('');
window.ICONS=urls;
</script></body></html>
